<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Kampus Demo</title><style>body{font:16px Arial;max-width:850px;margin:40px auto;padding:0 18px;background:#f4f7fa;color:#203040}section{background:white;padding:22px;margin:16px 0;border-radius:12px}button{padding:10px 16px;background:#176b87;color:white;border:0;border-radius:6px}pre{background:#eef3f7;padding:12px}</style></head><body><section><h1>Digital Kampus</h1><p>Prototipe layanan akademik untuk latihan DevOps. Bukan sistem produksi.</p></section><section><h2>Mata kuliah demo</h2><button id="load">Muat mata kuliah</button><ul id="courses"></ul></section><section><h2>Status layanan</h2><button id="health">Periksa layanan</button><pre id="result">Belum diperiksa.</pre></section><script>document.querySelector('#load').onclick=async()=>{let r=await fetch('/api/courses'),j=await r.json();document.querySelector('#courses').innerHTML=j.data.map(c=>`<li><b>${c.id}</b> — ${c.name} (${c.day}, ${c.start}-${c.end})</li>`).join('')};document.querySelector('#health').onclick=async()=>{let r=await fetch('/health');document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
